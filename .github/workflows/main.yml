name: Deploy AI Trip Platform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ai-trip-platform

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./Backend
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 using SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 596871239412.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 596871239412.dkr.ecr.us-east-1.amazonaws.com/ai-trip-platform:latest",
              "docker stop ai-trip-platform || true",
              "docker rm ai-trip-platform || true",
              "docker run -d --restart always --name ai-trip-platform -p 80:8000 --env-file /home/ubuntu/ai-trip-platform/.env -v /home/ubuntu/ai-trip-platform/firebase-service-account.json:/app/firebase-service-account.json:ro 596871239412.dkr.ecr.us-east-1.amazonaws.com/ai-trip-platform:latest"
            ]' \
            --comment "Deploy AI Trip Platform"
